[workspace]
members = [ "lidi-protocol", "lidi-send", "lidi-receive", "lidi-bindings", "lidi-clients", "lidi-command-utils" ]
default-members = [ "lidi-send", "lidi-receive", "lidi-bindings", "lidi-clients" ]
exclude = ["raptorq"]
resolver = "3"

# Local clone of https://github.com/CrabeDeFrance/raptorq, branch decode_to, patched to add a non-consuming,
# output-buffer decode entry point for lidi-receive's hot path.
[patch.crates-io]
raptorq = { path = "raptorq" }

[workspace.package]
version = "3.0.0"
edition = "2024"
license = "LGPL-3.0"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
missing-errors-doc = "allow"
nursery = { level = "deny", priority = -1 }

[profile.release]
opt-level = 3
lto = true
debug = true
strip = false
codegen-units = 1
panic = "abort"
