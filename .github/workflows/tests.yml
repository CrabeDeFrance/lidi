name: Tests

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test-features:
    name: Run build check for all features
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt full-upgrade
          sudo apt install just

      - name: Update rust
        run: rustup update

      - name: Install cargo hack
        run: cargo install cargo-hack

      - name: Build all features
        run: just cargo-hack

  tests:
    name: Run tests
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt full-upgrade
          sudo apt install python3-pip python3-virtualenv just valgrind

      - name: Update rust
        run: rustup update

      - name: Get admin permissions for tc
        run: sudo setcap cap_net_admin+ep /usr/sbin/tc

      - name: Create virtualenv
        run: virtualenv venv

      - name: Install python packages
        run: |
          source venv/bin/activate
          pip install behave psutil

      - name: Run tests
        run: |
          source venv/bin/activate
          just test
